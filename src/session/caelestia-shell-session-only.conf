# Drop-in for caelestia-shell.service, installed by scripts/12-independent-session.sh to
# /usr/local/lib/systemd/user/caelestia-shell.service.d/.
#
# The shell unit is wanted by graphical-session.target, which every graphical session reaches,
# a Plasma session included. Without this the shell started on top of plasmashell whenever
# "Plasma (Wayland)" was chosen at the login screen. caelestia-wm-session creates the file below
# before it starts the session and removes it as soon as the session ends, so the shell runs in
# the Caelestia session only.
#
# This is ExecCondition=, not ConditionPathExists=: systemd checks a Condition only on a normal
# start, not on the automatic restart (Restart=on-failure) that follows the shell's exit 255 when
# the session ends, and that restart brought the shell up inside the next Plasma session. The
# command runs on every start. Exit status 1 means "skip, quietly" (no failure, no restart loop).
[Service]
ExecCondition=/usr/bin/test -e %t/caelestia-session-active
