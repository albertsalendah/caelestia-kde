# Drop-in for caelestia-shell.service, installed by scripts/12-independent-session.sh to
# /usr/local/lib/systemd/user/caelestia-shell.service.d/.
#
# The shell unit is wanted by graphical-session.target, which every graphical session reaches,
# a Plasma session included. Without this the shell started on top of plasmashell whenever
# "Plasma (Wayland)" was chosen at the login screen. caelestia-wm-session creates this file
# before it starts the session and removes it when the session ends, so the shell starts in the
# Caelestia session only. A start the condition refuses is skipped quietly, not a failure.
[Unit]
ConditionPathExists=%t/caelestia-session-active
