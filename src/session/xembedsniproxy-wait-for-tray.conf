# Installed as /usr/local/lib/systemd/user/plasma-xembedsniproxy.service.d/10-caelestia-wait-for-tray.conf.
# plasma-xembedsniproxy shows the old X11 tray icons (Java and Compose apps such as AB Download
# Manager) in a StatusNotifier tray. Plasma starts it with plasmashell; the Caelestia session
# starts it from the session program, and this holds it back until the shell provides the tray.
# The unit's own TimeoutSec=5sec would cut that wait short, so the start timeout is raised.
# The script does nothing outside the Caelestia session, and "-" makes a missing script harmless.
[Service]
TimeoutStartSec=45
ExecStartPre=-/usr/local/bin/caelestia-wait-for-tray
