# Installed as /usr/local/lib/systemd/user/app-.service.d/10-caelestia-wait-for-tray.conf.
# A drop-in named "app-.service.d" applies to every user unit whose name starts with "app-":
# the units systemd's XDG autostart generator makes (app-<name>@autostart.service) and apps
# started from a launcher (app-<name>@<id>.service).
#
# Autostarted apps start at the same moment as the shell, before it provides the tray, and many
# ask for the tray once and give up. This holds an autostarted app back until the tray exists.
# The script waits for the instance "autostart" only, never longer than 30 seconds, and does
# nothing outside the Caelestia session. The "-" makes a missing script (after uninstall.sh)
# harmless, so an app never fails to start because of this file.
[Service]
ExecStartPre=-/usr/local/bin/caelestia-wait-for-tray --instance autostart %i
