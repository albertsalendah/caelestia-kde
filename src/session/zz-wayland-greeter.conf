[General]
DisplayServer=wayland
GreeterEnvironment=QML_XHR_ALLOW_FILE_READ=1,QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
# Some SDDM packages (CachyOS, SDDM 0.21) set SessionDir to /usr/share/wayland-sessions only, which
# hides the Caelestia entry in /usr/local. Both folders, as SDDM's own default has them.
SessionDir=/usr/local/share/wayland-sessions,/usr/share/wayland-sessions
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
