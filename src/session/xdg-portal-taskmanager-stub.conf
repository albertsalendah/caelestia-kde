# X-Caelestia-Managed=true
# Installed as /usr/local/lib/systemd/user/plasma-xdg-desktop-portal-kde.service.d/10-caelestia-taskmanager-stub.conf,
# and only on a machine without plasma-workspace. The screen picker of xdg-desktop-portal-kde imports
# org.kde.taskmanager, a QML module that plasma-workspace ships; without it the picker cannot open and
# every screen share fails. This points the portal at a small stand-in for that module (no live
# thumbnails in the picker). The step removes this file when the real module is there again.
[Service]
Environment=QML_IMPORT_PATH=/usr/local/share/caelestia/qml
Environment=QML2_IMPORT_PATH=/usr/local/share/caelestia/qml
